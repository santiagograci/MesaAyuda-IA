services:
  postgres:
    image: postgres:16-alpine
    container_name: mesaayuda-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mesaayuda-net

  rag-service:
    build: ./rag-service
    container_name: mesaayuda-rag-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./corpus:/app/corpus:ro
      - ./docs:/app/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mesaayuda-net

  backend:
    build: ./backend
    container_name: mesaayuda-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-mesaayuda};Username=${POSTGRES_USER:-mesaayuda_user};Password=${POSTGRES_PASSWORD:-mesaayuda_pass_2026}
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    networks:
      - mesaayuda-net

  frontend:
    build: ./frontend
    container_name: mesaayuda-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - mesaayuda-net

volumes:
  pgdata:

networks:
  mesaayuda-net:
    driver: bridge
