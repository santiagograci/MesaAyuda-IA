name: CI - MesaAyuda IA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rag-service-test:
    name: Python RAG Service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: rag-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch || true
          pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest -v

  backend-build-and-test:
    name: .NET 8 Backend (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/MesaAyuda.sln

      - name: Build solution (Release)
        run: dotnet build backend/MesaAyuda.sln --configuration Release --no-restore

      - name: Run xUnit unit and integration tests
        run: dotnet test backend/MesaAyuda.sln --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Angular 18 Frontend (Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build Angular production bundle
        run: npm run build
